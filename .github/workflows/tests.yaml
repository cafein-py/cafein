name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python linters
        run: pip install black flake8
      - name: black
        run: black --check python/cafein tests
      - name: flake8
        run: flake8 python/cafein tests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      CAFEIN_REQUIRE_TEST_DATA: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["310", "311", "312", "313", "314"]
        # macOS runners are few and queue behind a low concurrency cap,
        # so they cover only the boundary Pythons; ubuntu and windows
        # keep the full version axis.
        exclude:
          - os: macos-latest
            python: "311"
          - os: macos-latest
            python: "312"
          - os: macos-latest
            python: "313"
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/py${{ matrix.python }}-conda.yaml
          environment-name: test
          cache-environment: true
          condarc: |
            channel_priority: strict
      # The Rust workspace and the crate registry rebuild identically
      # across the Python matrix (the extension is abi3), so one warm
      # cache per OS serves every cell.
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('ci/py*-conda.yaml') }}
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test data
        shell: bash -el {0}
        run: python scripts/fetch_test_data.py
      - name: Run Rust tests
        shell: bash -el {0}
        run: cargo test --workspace
      # Dependencies install separately with default build isolation:
      # pyrosm's cykhash ships no wheels and needs Cython to build, which
      # --no-build-isolation would hide.
      - name: Install Python dependencies
        shell: bash -el {0}
        run: pip install geopandas numpy pandas pyrosm scipy shapely
      - name: Install cafein
        shell: bash -el {0}
        run: pip install -e . --no-build-isolation
      - name: Run Python tests
        shell: bash -el {0}
        # Parallelised across the runner's cores with pytest-xdist. Each
        # worker's Rust compute is capped to two rayon threads: uncapped,
        # every worker spawns a pool as wide as the machine, and the heavy
        # multicriteria tests contend N-fold for the same cores. Linux
        # runners cap at three workers: with four, the workers' session
        # network fixtures together exceed the 7 GB runner near the end
        # of the suite and the OOM reaper stops the runner service —
        # the job dies with "runner received a shutdown signal", not a
        # test failure.
        env:
          RAYON_NUM_THREADS: 2
        # Coverage is informational (term-missing, no upload), so one
        # cell collects it; the rest skip the instrumentation overhead.
        run: >-
          pytest -n ${{ runner.os == 'Linux' && '3' || 'auto' }}
          --dist load --durations=20
          ${{ matrix.os == 'ubuntu-latest' && matrix.python == '312'
              && '--cov=cafein --cov-report=term-missing' || '' }}
