name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python linters
        run: pip install black flake8
      - name: black
        run: black --check python/cafein tests
      - name: flake8
        run: flake8 python/cafein tests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The Rust tests do not depend on the Python version, so they run once per
  # OS rather than in every cell of the Python matrix.
  rust:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      CAFEIN_REQUIRE_TEST_DATA: "1"
      # Dependencies already build optimised; optimising the workspace crates
      # too keeps the Helsinki integration tests from running unoptimised.
      # Debug assertions and overflow checks stay on.
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/py314-conda.yaml
          environment-name: test
          cache-environment: true
          condarc: |
            channel_priority: strict
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: rust-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-tests-${{ runner.os }}-
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test data
        shell: bash -el {0}
        run: python scripts/fetch_test_data.py
      - name: Run Rust tests
        shell: bash -el {0}
        run: cargo test --workspace

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      CAFEIN_REQUIRE_TEST_DATA: "1"
      # Each cell runs one of two shards of the test files, balanced by the
      # weights in tests/conftest.py.
      CAFEIN_TEST_SHARD: ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) ends the test jobs with a runner shutdown
        # mid-suite; the jobs run on 24.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["311", "312", "313", "314", "315"]
        shard: [1, 2]
        # macOS and Windows cover only the boundary Pythons, which keeps the
        # matrix within the account's concurrent runners; ubuntu keeps the
        # full version axis.
        exclude:
          - os: macos-latest
            python: "312"
          - os: macos-latest
            python: "313"
          - os: macos-latest
            python: "314"
          - os: windows-latest
            python: "312"
          - os: windows-latest
            python: "313"
          - os: windows-latest
            python: "314"
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/py${{ matrix.python }}-conda.yaml
          environment-name: test
          cache-environment: true
          condarc: |
            channel_priority: strict
      # The extension and the crate registry rebuild identically across the
      # Python matrix (the extension is abi3), so one warm cache per OS
      # serves every cell.
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: rust-extension-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-extension-${{ runner.os }}-
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('ci/py*-conda.yaml') }}
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test data
        shell: bash -el {0}
        run: python scripts/fetch_test_data.py
      - name: Install Python dependencies
        shell: bash -el {0}
        run: pip install geopandas numpy pandas pyrosm scipy shapely
      - name: Install cafein
        shell: bash -el {0}
        run: pip install -e . --no-build-isolation
      - name: Run Python tests
        shell: bash -el {0}
        # Parallelised across the runner's cores with pytest-xdist. Each
        # worker's Rust compute is capped to two rayon threads: uncapped,
        # every worker spawns a pool as wide as the machine, and the heavy
        # multicriteria tests contend N-fold for the same cores. Linux
        # runners (16 GB, 3 GB swap) run two workers: each grows to 4–6 GB
        # over the suite, three exhaust memory and swap, and the OOM reaper
        # then stops the runner service — the job dies with "runner
        # received a shutdown signal", not a test failure. Temporary files
        # go to the runner's disk: newer Ubuntu images mount /tmp as tmpfs,
        # where the tests' artifacts would take memory too.
        # Coverage is informational (term-missing, no upload), so one
        # Python version collects it, each shard for its own files; the
        # rest skip the instrumentation overhead. Every test step of a
        # second or more is listed: the shard weights in tests/conftest.py
        # come from these timings.
        env:
          RAYON_NUM_THREADS: 2
          WORKERS: ${{ runner.os == 'Linux' && '2' || 'auto' }}
          COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '312' && '--cov=cafein --cov-report=term-missing' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export TMPDIR="$RUNNER_TEMP"; fi
          pytest -n "$WORKERS" --dist load --durations=0 --durations-min=1.0 $COVERAGE

  # The check branch protection requires: it passes only when lint, the Rust
  # tests and every cell of the Python matrix passed, so the required check
  # survives changes to the matrix.
  all-tests:
    name: All tests
    if: always()
    needs: [lint, rust, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.test.result }}" = success
