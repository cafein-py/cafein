name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python linters
        run: pip install black flake8
      - name: black
        run: black --check python/cafein tests
      - name: flake8
        run: flake8 python/cafein tests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      CAFEIN_REQUIRE_TEST_DATA: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "313", variant: profile}
          - {os: ubuntu-latest, python: "313", variant: malloc}
          - {os: ubuntu-latest, python: "313", variant: loop}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/py${{ matrix.python }}-conda.yaml
          environment-name: test
          cache-environment: true
          condarc: |
            channel_priority: strict
      # The Rust workspace and the crate registry rebuild identically
      # across the Python matrix (the extension is abi3), so one warm
      # cache per OS serves every cell.
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('ci/py*-conda.yaml') }}
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test data
        shell: bash -el {0}
        run: python scripts/fetch_test_data.py
      - name: Run Rust tests
        shell: bash -el {0}
        run: cargo test --workspace
      # Dependencies install separately with default build isolation:
      # pyrosm's cykhash ships no wheels and needs Cython to build, which
      # --no-build-isolation would hide.
      - name: Install Python dependencies
        shell: bash -el {0}
        run: pip install geopandas numpy pandas pyrosm scipy shapely
      - name: Install cafein
        shell: bash -el {0}
        run: pip install -e . --no-build-isolation
      - name: Run Python tests
        shell: bash -el {0}
        # Parallelised across the runner's cores with pytest-xdist. Each
        # worker's Rust compute is capped to two rayon threads: uncapped,
        # every worker spawns a pool as wide as the machine, and the heavy
        # multicriteria tests contend N-fold for the same cores. Linux
        # runners (16 GB, 3 GB swap) run two workers: each grows to 4–6 GB
        # over the suite, three exhaust memory and swap, and the OOM reaper
        # then stops the runner service — the job dies with "runner
        # received a shutdown signal", not a test failure. Temporary files
        # go to the runner's disk: newer Ubuntu images mount /tmp as tmpfs,
        # where the tests' artifacts would take memory too.
        # Coverage is informational (term-missing, no upload), so one
        # cell collects it; the rest skip the instrumentation overhead.
        env:
          RAYON_NUM_THREADS: 2
          WORKERS: ${{ runner.os == 'Linux' && '2' || 'auto' }}
          COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '312' && '--cov=cafein --cov-report=term-missing' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export TMPDIR="$RUNNER_TEMP"; fi
          export PYTHONPATH="$PWD/ci/memdiag" MEMPROF_DIR="$RUNNER_TEMP/memprof"
          if [ "${{ matrix.variant }}" = "malloc" ]; then
            export MALLOC_MMAP_THRESHOLD_=131072 MALLOC_TRIM_THRESHOLD_=131072
          fi
          echo "variant=${{ matrix.variant }} MALLOC_MMAP_THRESHOLD_=${MALLOC_MMAP_THRESHOLD_:-unset}"
          if [ "${{ matrix.variant }}" = "loop" ]; then
            python ci/memdiag/memloop.py
            exit 0
          fi
          status=0
          pytest -n "$WORKERS" --dist load -q -p memprof_plugin --durations=10 || status=$?
          python ci/memdiag/analyse.py "$MEMPROF_DIR"
          exit $status
